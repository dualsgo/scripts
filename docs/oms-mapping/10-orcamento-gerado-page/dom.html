<html lang="pt" ng-controller="mainController" ng-init="main.storeConfig()" class="ng-scope">
<!-- 
  NOTA: Este arquivo contém a estrutura inicial da aba Detalhes do Pedido (Orçamento Gerado).
  Representa o momento exato após o SEFAZ aprovar o faturamento.
-->
<head>
  <!-- ... tags do head ... -->
</head>
<body>
  <div ui-view="main" class="main-content ng-scope">
    <div class="container order-content ng-scope" ng-controller="fulfillmentViewController">
      
      <!-- Status e Título -->
      <div class="fulfillment-status-billing_confirmation">
        <div class="page-header">
          <h1>Detalhes da entrega</h1>
          <div class="clearfix">
            <div class="pull-left fulfillment-details-title">
              <span>N⁰:</span>
              <h2 class="ng-binding">v35944745rihp-01</h2>
              <!-- STATUS AGORA É 'ORÇAMENTO GERADO' -->
              <span class="order-status ng-binding billing_confirmation">Orçamento Gerado</span>
            </div>
            
            <!-- Botões de Ação -->
            <div class="pull-right fulfillment-buttons-control ng-scope">
              <!-- Aqui os botões específicos desse status apareceriam, ou a ação é feita em lote pela Seleção -->
            </div>
          </div>
        </div>

        <!-- TIMELINE ATUALIZADA -->
        <div class="order-history-timeline">
            <!-- ... etapas anteriores ... -->
            <div class="order-history-step text-center ng-scope">
                <p class="lead ng-binding">07/07/2026 <br>00:11</p>
                <div class="order-history-status ng-binding">Aguardando orçamento</div>
            </div>
            <div class="order-history-step text-center ng-scope">
                <p class="lead ng-binding">07/07/2026 <br>00:12</p>
                <div class="order-history-status ng-binding">Orçamento Gerado</div>
            </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
